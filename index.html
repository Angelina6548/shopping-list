<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой список покупок</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="app">
    <form id="login" class="login-form">
      <h2>Вход в общий список</h2>
      <input id="email" type="email" placeholder="Электронная почта" autocomplete="username" required>
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
    <p id="status" role="status">Подключение…</p>
    <section id="content" class="hidden">
    <h1>🛒 Список покупок</h1>

    <!-- Блок рекомендаций -->
    <div id="recommendations-box" class="recommendations-box hidden">
      <h3>💡 Вам может понадобиться:</h3>
      <div id="recommendations-list" class="recommendations-list"></div>
    </div>

    <!-- Форма добавления -->
    <form id="add-form" class="add-form">
      <input type="text" id="item-input" placeholder="Что купить? (например, молоко)" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <!-- Текущий список -->
    <ul id="shopping-list" class="list"></ul>
    <p id="empty-message" class="empty">Список пока пуст. Самое время что-нибудь добавить! 👆</p>

    <!-- Кнопка завершения -->
    <button id="finish-btn" class="finish-btn hidden">✅ Завершить покупки</button>
    </section>
  </div>
<script type="module" src="app.js"></script>
</body>
</html>
