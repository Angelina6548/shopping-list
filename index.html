<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111510">
  <title>Мой список покупок</title>
  <link rel="stylesheet" href="style.css?v=21">
  <link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div class="app">
<header class="brand"><span class="brand-icon">✳</span><span>МОИ ПОКУПКИ<small> SMART SHOPPING</small></span></header>
    <form id="login" class="login-form">
      <h2>Вход в общий список</h2>
      <input id="email" type="email" placeholder="Электронная почта" autocomplete="username" required>
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </form>
    <p id="status" role="status">Подключение…</p>
    <section id="content" class="hidden">
    <nav id="tabs"></nav><div id="shopping-panel"><h1>За покупками<span>.</span></h1><p class="subtitle">Всё нужное в одном месте.</p>
<div class="tools"><select id="list-select"><option>Продукты</option><option>Аптека</option><option>Дом</option></select><button id="voice" type="button">🎙 Голос</button></div><div class="progress-card"><div><small>ТВОЙ ПРОГРЕСС</small><strong id="progress-count">0 из 0</strong><span>Продуктов в корзине</span></div><div class="ring" id="progress-ring"><b id="progress-percent">0%</b></div><div class="track"><div id="progress-bar"></div></div></div>

    <div class="extra-card"><form id="budget-form"><label for="budget">Бюджет, ₽</label><div class="budget-row"><input id="budget" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"><button id="budget-save" type="submit">Сохранить</button></div><small id="budget-message" role="status"></small></form><strong id="total"></strong></div><!-- Блок рекомендаций -->
    <div id="recommendations-box" class="recommendations-box hidden">
      <h3>✦ Часто покупаете</h3>
      <div id="recommendations-list" class="recommendations-list"></div>
    </div>

    <!-- Форма добавления -->
    <form id="add-form" class="add-form">
      <input type="text" id="item-input" placeholder="Что нужно купить?" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <div class="list-heading"><h2>Список покупок</h2><span id="remaining"></span></div>
    <ul id="shopping-list" class="list"></ul>
    <p id="empty-message" class="empty"><span class="empty-icon">🛍️</span>Список пока пуст.<br>Добавьте что-нибудь вкусное!</p>

    <!-- Кнопка завершения -->
    <button id="finish-btn" class="finish-btn hidden">✓ Завершить покупки</button>
    <button id="undo" class="hidden">↩ Отменить удаление</button></div><section id="other-panel" class="hidden"></section><footer>✳ &nbsp; Маленькие покупки. Большие планы.</footer></section>
  </div>
<script type="module" src="app.js?v=21"></script>
</body>
</html>
